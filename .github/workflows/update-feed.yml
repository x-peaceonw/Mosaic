name: Update Mosaic Feed

on:
  schedule:
    - cron: "0 */4 * * *"   #e as you like
  workflow_dispatch:        # lets you trigger it manually from GitHub too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests python-dotenv googlenewsdecoder,

      - name: Debug secret lengths (safe - no values shown)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          echo "YOUTUBE_API_KEY length: ${#YOUTUBE_API_KEY}"
          echo "CLIENT_ID length: ${#CLIENT_ID}"
          echo "CLIENT_SECRET length: ${#CLIENT_SECRET}"
          echo "NEWSAPI_KEY length: ${#NEWSAPI_KEY}"

      - name: Fetch new releases
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python update_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "mosaic-bot"
          git config user.email "bot@mosaic.local"
          git add data/music.json
          git diff --staged --quiet || git commit -m "Update feed"
          git pull --no-rebase -X ours origin main
          git push
